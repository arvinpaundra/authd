name: CI

# macOS only: the QR seam is Vision and the secret store is the Keychain, so there is
# nothing meaningful to check on another runner yet.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  BUN_VERSION: 1.3.10

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build # the Rust build embeds ui/src, so the bundle has to exist first

      - run: cargo fmt --check
        working-directory: tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: tauri
      - run: cargo test
        working-directory: tauri
