<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Authd</title>
<style>
  /* Light. Borrows float's language: system font, 700 titles over muted subs, pill buttons with scale
     feedback, 38×22 switches, hairline borders, conic arcs, overlay panels instead of tabs.
     Every hover / active state is black at low opacity — no second surface colour. */
  :root{
    --card:#fff;
    --line:rgba(0,0,0,.10);
    --line-soft:rgba(0,0,0,.06);
    --ink:#000;
    --ink-2:#6e6e73;
    --ink-3:#8e8e93;
    --hover:rgba(0,0,0,.04);
    --press:rgba(0,0,0,.08);
    --fill:rgba(0,0,0,.05);
    --accent:#0a84ff;
    --accent-hi:#309dff;
    --warn:#ff9500;
    --header:38px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;background:#f2f2f4;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
    -webkit-font-smoothing:antialiased;user-select:none;
    display:grid;place-items:center;padding:40px 24px;
  }
  button,label,.chip,.item,.face,input[type=range],.switch{cursor:pointer}
  .search input,.field textarea{cursor:text;user-select:text}
  .stage{display:flex;gap:40px;align-items:flex-start;flex-wrap:wrap;justify-content:center}

  /* ---- card ---- */
  .card{
    width:380px;height:560px;display:grid;grid-template-rows:var(--header) 1fr;
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    overflow:hidden;position:relative;box-shadow:0 10px 30px -12px rgba(0,0,0,.18);
  }
  .header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 10px}
  .lights{justify-self:start;display:flex;gap:8px}
  .lights button{
    width:12px;height:12px;border-radius:50%;border:.5px solid rgba(0,0,0,.12);
    display:grid;place-items:center;padding:0;cursor:pointer;
  }
  .lights .c{background:#ff5f57;border-color:#e0443e}
  .lights .m{background:#febc2e;border-color:#dea123}
  .lights .z{background:#28c840;border-color:#1dad2b}
  .lights svg{opacity:0}
  .lights:hover svg{opacity:1}
  .wtitle{font:600 12.5px -apple-system,sans-serif;color:var(--ink-2);letter-spacing:.1px}
  .hactions{justify-self:end;display:flex;gap:2px}
  .ib{
    width:26px;height:26px;display:grid;place-items:center;border:0;border-radius:50%;
    background:none;color:var(--ink-2);cursor:pointer;transition:background .15s,color .15s,transform .1s;
  }
  .ib:hover{background:var(--hover);color:var(--ink)}
  .ib:active{background:var(--press);transform:scale(.92)}
  .ib.on{color:var(--accent)}

  /* ---- vault ---- */
  .body{display:grid;grid-template-rows:auto 1fr;min-height:0}
  .search{padding:2px 12px 8px}
  .search div{
    height:34px;display:flex;align-items:center;gap:8px;padding:0 12px;
    background:var(--fill);border-radius:17px;transition:background .15s;
  }
  .search div:focus-within{background:rgba(0,0,0,.07)}
  .search svg{flex:0 0 auto;color:var(--ink-3)}
  .search input{
    flex:1;border:0;background:none;outline:none;color:var(--ink);
    font:13.5px/1 -apple-system,sans-serif;
  }
  .search input::placeholder{color:var(--ink-3)}

  .list{overflow-y:auto;padding:0 6px 8px;scrollbar-width:none;min-height:0}
  .list::-webkit-scrollbar{display:none}
  .item{height:52px;position:relative;overflow:hidden;border-radius:9px;touch-action:pan-y}
  .item.drag{opacity:.35}
  .item.over{box-shadow:inset 0 2px 0 var(--accent)}
  /* the face slides left to uncover the actions behind it */
  .face{
    position:absolute;inset:0;display:flex;align-items:center;gap:11px;padding:0 10px;
    background:var(--card);border-radius:9px;cursor:pointer;
    transition:transform .24s cubic-bezier(.2,.8,.2,1);
  }
  .face::before{
    content:"";position:absolute;inset:0;background:#000;opacity:0;border-radius:9px;
    transition:opacity .15s;pointer-events:none;
  }
  .face:hover::before{opacity:.04}
  .face:active::before{opacity:.08}
  .face>*{position:relative}
  .item.swiping .face{transition:none}
  .item.open .face{transform:translateX(-88px)}
  .swipe{position:absolute;top:0;right:0;bottom:0;display:flex;border-radius:0 9px 9px 0;overflow:hidden}
  .swipe button{
    width:44px;height:100%;border:0;display:grid;place-items:center;cursor:pointer;
    transition:filter .15s;
  }
  .swipe button:active{filter:brightness(.92)}
  .swipe .edit{background:rgba(0,0,0,.10);color:var(--ink)}
  .swipe .del{background:#ff3b30;color:#fff}
  .mono{
    width:30px;height:30px;flex:0 0 30px;border-radius:8px;display:grid;place-items:center;
    background:var(--fill);font:700 13px/1 -apple-system,sans-serif;color:var(--ink-2);
  }
  .meta{flex:1;min-width:0;
    mask-image:linear-gradient(90deg,#000 92%,transparent);
    -webkit-mask-image:linear-gradient(90deg,#000 92%,transparent);
  }
  .name{font:700 14px/1.25 -apple-system,sans-serif;white-space:nowrap;overflow:hidden}
  .sub{margin-top:1px;font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden}
  .right{display:flex;align-items:center;gap:9px;flex-shrink:0}
  .code{
    font:700 16px/1 ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:1.2px;
    font-variant-numeric:tabular-nums;transition:color .3s;
  }
  .code.soon{color:var(--warn)}
  /* determinate arc, float's conic + mask trick */
  .ring{
    width:20px;height:20px;flex:0 0 20px;border-radius:50%;
    background:conic-gradient(var(--accent) calc(var(--p,0) * 1turn), rgba(0,0,0,.12) 0);
    -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2.5px),#000 calc(100% - 2.5px));
    mask:radial-gradient(farthest-side,transparent calc(100% - 2.5px),#000 calc(100% - 2.5px));
  }
  .ring.soon{background:conic-gradient(var(--warn) calc(var(--p,0) * 1turn), rgba(0,0,0,.12) 0)}
  .acts{display:none;gap:1px;margin-right:-4px}
  .item:hover .acts{display:flex}
  .empty{color:var(--ink-3);text-align:center;padding:48px 20px;font-size:13px}

  /* ---- overlay panels ---- */
  .panelview{
    position:absolute;top:var(--header);left:0;right:0;bottom:0;z-index:4;display:none;
    align-content:start;gap:14px;padding:6px 20px 18px;background:var(--card);
    overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;
  }
  .panelview::-webkit-scrollbar{display:none}
  .panelview.on{display:grid}
  .panelview h2{font:700 17px/1.3 -apple-system,sans-serif}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:15px}
  .row small{display:block;color:var(--ink-3);font-size:11px;margin-top:1px;font-weight:400}
  .row span>b{font-weight:400}

  /* switch — float's 38×22 */
  .switch{position:relative;width:38px;height:22px;flex-shrink:0;cursor:pointer}
  .switch input{position:absolute;inset:0;opacity:0;margin:0}
  .switch span{
    position:absolute;inset:0;border-radius:11px;background:rgba(0,0,0,.16);
    transition:background .15s ease;pointer-events:none;
  }
  .switch span::after{
    content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;
    background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.28);transition:transform .15s ease;
  }
  .switch input:checked+span{background:var(--accent)}
  .switch input:checked+span::after{transform:translateX(16px)}

  /* range */
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:116px;height:16px;flex-shrink:0;background:none;cursor:pointer;
  }
  input[type=range]::-webkit-slider-runnable-track{
    height:4px;border-radius:2px;
    background:linear-gradient(90deg,var(--accent) var(--f,0%),rgba(0,0,0,.14) var(--f,0%));
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:13px;height:13px;margin-top:-4.5px;border-radius:50%;
    background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);
  }
  input[type=range]:hover::-webkit-slider-runnable-track{
    background:linear-gradient(90deg,var(--accent-hi) var(--f,0%),rgba(0,0,0,.2) var(--f,0%));
  }

  /* buttons */
  .pill{
    height:34px;padding:0 24px;border:0;border-radius:17px;background:var(--accent);color:#fff;
    font:700 15px -apple-system,sans-serif;cursor:pointer;transition:background .15s,transform .1s;
  }
  .pill:hover{background:var(--accent-hi)}
  .pill:active{transform:scale(.97)}
  .pill.wide{justify-self:center;margin-top:6px}
  .ghost{
    height:28px;padding:0 14px;border:1px solid rgba(0,0,0,.22);border-radius:14px;background:none;
    color:var(--ink);font:600 13px -apple-system,sans-serif;cursor:pointer;transition:.15s;
  }
  .ghost:hover{border-color:var(--ink);background:var(--hover)}
  .ghost:active{background:var(--press)}

  /* segmented */
  .seg{display:flex;gap:2px;padding:2px;background:var(--fill);border-radius:9px}
  .seg button{
    flex:1;height:26px;border:0;border-radius:7px;background:none;color:var(--ink-2);
    font:600 12.5px -apple-system,sans-serif;cursor:pointer;transition:.15s;
  }
  .seg button:hover{color:var(--ink)}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

  /* field */
  .field{background:var(--fill);border-radius:10px;padding:10px 12px;transition:background .15s}
  .field:focus-within{background:rgba(0,0,0,.07)}
  .field textarea{
    width:100%;min-height:76px;border:0;background:none;outline:none;resize:vertical;color:var(--ink);
    font:12.5px/1.55 ui-monospace,"SF Mono",Menlo,monospace;
  }
  .field textarea::placeholder{color:var(--ink-3)}
  .note{font-size:11px;color:var(--ink-3)}
  .note.err{color:#d70015;display:none}
  .drop{
    border:1px dashed rgba(0,0,0,.2);border-radius:10px;padding:28px 16px;text-align:center;
    color:var(--ink-3);font-size:12.5px;transition:.15s;
  }
  .drop.hot{border-color:var(--accent);background:rgba(10,132,255,.06);color:var(--ink)}
  .end{display:flex;justify-content:flex-end;gap:8px}
  .chip{
    height:28px;display:inline-flex;align-items:center;padding:0 12px;border-radius:8px;
    background:var(--fill);font:600 12.5px ui-monospace,Menlo,monospace;cursor:pointer;transition:.15s;
  }
  .chip:hover{background:rgba(0,0,0,.08)}
  .chip.rec{background:rgba(10,132,255,.12);color:var(--accent);animation:blink 1.2s infinite}
  @keyframes blink{50%{opacity:.55}}

  /* ---- quick panel ---- */
  .side{display:flex;flex-direction:column;align-items:center;gap:18px}
  .quick{
    width:330px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;
    box-shadow:0 12px 34px -14px rgba(0,0,0,.22);
  }
  .quick .item{height:46px}
  .quick .sel .face::before{opacity:.045}
  .cap{color:var(--ink-3);font-size:12px;text-align:center;line-height:1.7;max-width:300px}
  .cap kbd{
    font:11.5px ui-monospace,Menlo,monospace;background:var(--fill);color:var(--ink-2);
    padding:2px 6px;border-radius:5px;
  }
  /* ---- toast, float's "up next" pill ---- */
  .toast{
    position:fixed;bottom:28px;left:50%;transform:translate(-50%,8px);opacity:0;
    padding:6px 14px;border-radius:13px;background:rgba(0,0,0,.72);color:#fff;
    font:600 12px -apple-system,sans-serif;backdrop-filter:blur(8px);
    transition:opacity .25s ease,transform .25s ease;pointer-events:none;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="stage">

  <div class="card">
    <div class="header">
      <div class="lights">
        <button class="c" aria-label="Close"><svg width="6" height="6" viewBox="0 0 6 6"><path d="M.75.75l4.5 4.5M5.25.75l-4.5 4.5" stroke="#4d0000" stroke-width="1.1" stroke-linecap="round"/></svg></button>
        <button class="m" aria-label="Minimize"><svg width="6" height="6" viewBox="0 0 6 6"><path d="M.75 3h4.5" stroke="#90591a" stroke-width="1.1" stroke-linecap="round"/></svg></button>
        <button class="z" aria-label="Zoom"><svg width="6" height="6" viewBox="0 0 6 6"><path d="M1.4 4.6h3.2V1.4" fill="#0b6b14"/></svg></button>
      </div>
      <div class="wtitle">Authd</div>
      <div class="hactions">
        <button class="ib" id="b-add" title="Add">
          <svg width="14" height="14" viewBox="0 0 14 14"><path d="M7 1.6v10.8M1.6 7h10.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
        <button class="ib" id="b-set" title="Settings">
          <svg width="16" height="14" viewBox="0 0 16 14"><path d="M1 4h14M1 10h14" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><circle cx="10" cy="4" r="2.1" fill="#fff" stroke="currentColor" stroke-width="1.3"/><circle cx="5.5" cy="10" r="2.1" fill="#fff" stroke="currentColor" stroke-width="1.3"/></svg>
        </button>
      </div>
    </div>

    <div class="body">
      <div class="search">
        <div>
          <svg width="13" height="13" viewBox="0 0 13 13"><circle cx="5.5" cy="5.5" r="4.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8.7 8.7l3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          <input id="q" placeholder="Search" autocomplete="off">
        </div>
      </div>
      <div class="list" id="list"></div>
    </div>

    <!-- add -->
    <div class="panelview" id="p-add">
      <h2 id="add-title">Add account</h2>
      <div class="seg" id="seg">
        <button class="on" data-m="uri">Link</button>
        <button data-m="qr">Image</button>
        <button data-m="bulk">Transfer</button>
      </div>
      <div data-mode="uri" style="display:grid;gap:10px">
        <div class="field"><textarea id="uri-in" placeholder="otpauth://totp/GitHub:you@example.com?secret=…"></textarea></div>
        <p class="note">A key on its own works too.</p>
        <p class="note err" id="uri-msg"></p>
        <div class="end"><button class="ghost" id="uri-clear">Clear</button><button class="pill" id="uri-add" style="height:28px;padding:0 18px;font-size:13px;border-radius:14px">Add</button></div>
      </div>
      <div data-mode="qr" hidden style="display:none;gap:10px">
        <div class="drop" id="drop">Drop a QR image<br><span style="color:rgba(0,0,0,.3)">or press ⌘V to paste</span></div>
      </div>
      <div data-mode="bulk" hidden style="display:none;gap:10px">
        <div class="field"><textarea id="bulk-in" placeholder="otpauth-migration://offline?data=…"></textarea></div>
        <div class="end"><button class="pill" id="bulk-add" style="height:28px;padding:0 18px;font-size:13px;border-radius:14px">Import all</button></div>
      </div>
      <button class="pill wide" data-close>Done</button>
    </div>

    <!-- settings -->
    <div class="panelview" id="p-set">
      <h2>Settings</h2>
      <label class="row"><span>Reveal on hover<small>Codes stay hidden until pointed at</small></span>
        <span class="switch"><input type="checkbox" id="sw-mask"><span></span></span></label>
      <div class="row"><span>Global shortcut<small id="rec-note">Summon the list anywhere</small></span>
        <span class="chip" id="rec">⌘ ⇧ Y</span></div>
      <label class="row"><span>Stay out of the way<small>Keeps the app you were using focused</small></span>
        <span class="switch"><input type="checkbox" id="sw-panel" checked><span></span></span></label>
      <label class="row"><span>Open at login<small>Start Authd with the Mac</small></span>
        <span class="switch"><input type="checkbox" id="sw-login" checked><span></span></span></label>
      <label class="row"><span>Clear clipboard<small id="clip-note">after 30 s</small></span>
        <input type="range" id="clip" min="0" max="120" step="15" value="30"></label>
      <div class="row"><span>Keys<small>Copy every key out of the Keychain</small></span>
        <button class="ghost">Export</button></div>
      <button class="pill wide" data-close>Done</button>
    </div>
  </div>

  <div class="side">
    <div class="quick"><div class="list" id="plist" style="padding:0;overflow:visible"></div></div>
    <p class="cap">Press <kbd>⌘⇧Y</kbd> anywhere.<br>
      <kbd>↑</kbd> <kbd>↓</kbd> to move, <kbd>↵</kbd> to copy, <kbd>1</kbd>–<kbd>9</kbd> to jump.</p>
  </div>

</div>
<div class="toast" id="toast"></div>

<script>
// ---------- TOTP ----------
const B32 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
function b32decode(s){
  let bits = '';
  for (const c of s.replace(/[\s=]/g,'').toUpperCase()){
    const v = B32.indexOf(c);
    if (v < 0) throw new Error("That key doesn't look right.");
    bits += v.toString(2).padStart(5,'0');
  }
  const out = new Uint8Array(bits.length >> 3);
  for (let i=0;i<out.length;i++) out[i] = parseInt(bits.substr(i*8,8),2);
  return out;
}
async function totp(secret, period=30, digits=6){
  const key = await crypto.subtle.importKey('raw', b32decode(secret), {name:'HMAC',hash:'SHA-1'}, false, ['sign']);
  const msg = new Uint8Array(8);
  new DataView(msg.buffer).setBigUint64(0, BigInt(Math.floor(Date.now()/1000/period)));
  const h = new Uint8Array(await crypto.subtle.sign('HMAC', key, msg));
  const o = h[19] & 0xf;
  const n = ((h[o]&0x7f)<<24 | h[o+1]<<16 | h[o+2]<<8 | h[o+3]) % 10**digits;
  return String(n).padStart(digits,'0');
}
// ponytail: URL parser instead of a regex. Covers the fields v1 needs.
function parseURI(raw){
  const t = raw.trim();
  if (!t.toLowerCase().startsWith('otpauth://')) return {issuer:'Unknown', label:'', secret:t, period:30, digits:6};
  const u = new URL(t);
  if (u.host.toLowerCase() !== 'totp') throw new Error('Only time-based codes are supported.');
  const path = decodeURIComponent(u.pathname.replace(/^\//,''));
  const [a,b] = path.includes(':') ? path.split(/:(.+)/) : [null, path];
  const secret = u.searchParams.get('secret');
  if (!secret) throw new Error('That link has no key in it.');
  return {
    issuer: u.searchParams.get('issuer') || a || 'Unknown',
    label: b || '',
    secret,
    period: +(u.searchParams.get('period') || 30),
    digits: +(u.searchParams.get('digits') || 6),
  };
}

// ---------- state ----------
let accounts = [
  {issuer:'GitHub',    label:'you@example.com'  , secret:'JBSWY3DPEHPK3PXP',       period:30, digits:6},
  {issuer:'Cloudflare',label:'example.com',    secret:'KRSXG5CTMVRXEZLUFQ',     period:30, digits:6},
  {issuer:'Amazon',    label:'root · prod',    secret:'MFRGGZDFMZTWQ2LKNNWG23Q',period:30, digits:6},
  {issuer:'Vercel',    label:'example',        secret:'GEZDGNBVGY3TQOJQ',       period:30, digits:8},
  {issuer:'Stripe',    label:'live',           secret:'ONSWG4TFOQ======',       period:30, digits:6},
  {issuer:'Proton',    label:'you@example.com',secret:'NBSWY3DPFQQHO33SNRSA',   period:30, digits:6},
];
let mask = false, sel = 0, filter = '';

const $  = s => document.querySelector(s);
const vis = () => accounts.filter(a => (a.issuer+' '+a.label).toLowerCase().includes(filter));

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('show'), 1600);
}
async function copy(a){
  const c = await totp(a.secret, a.period, a.digits);
  try { await navigator.clipboard.writeText(c); } catch {}
  toast('Copied');
}
const ICON = {
  edit:'<svg width="15" height="15" viewBox="0 0 15 15"><path d="M10 2.2l2.8 2.8-7.2 7.2-3.4.6.6-3.4L10 2.2z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>',
  del:'<svg width="15" height="15" viewBox="0 0 15 15"><path d="M2.8 4.2h9.4M5.8 4.2V2.6h3.4v1.6M4.1 4.2l.6 8.2h5.6l.6-8.2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>',
};

// ---------- render ----------
function itemHTML(a, i, compact){
  return '<div class="item'+(compact && i===sel ? ' sel' : '')+'" data-i="'+i+'"'+(compact?'':' draggable="true"')+'>'
    + (compact ? '' : '<div class="swipe">'
        + '<button class="edit" data-act="edit" title="Rename">'+ICON.edit+'</button>'
        + '<button class="del" data-act="del" title="Remove">'+ICON.del+'</button></div>')
    + '<div class="face">'
    + '<div class="mono">'+a.issuer[0].toUpperCase()+'</div>'
    + '<div class="meta"><div class="name">'+a.issuer+'</div><div class="sub">'+(a.label||'—')+'</div></div>'
    + '<div class="right"><div class="code" data-code>······</div><div class="ring" data-ring></div></div>'
    + '</div></div>';
}
function render(){
  openRow = null;
  const v = vis();
  $('#list').innerHTML  = v.length ? v.map((a,i)=>itemHTML(a,i,false)).join('') : '<div class="empty">No accounts yet</div>';
  $('#plist').innerHTML = v.slice(0,5).map((a,i)=>itemHTML(a,i,true)).join('');
  tick();
}
async function tick(){
  const v = vis();
  for (const host of [$('#list'), $('#plist')]){
    for (const row of host.querySelectorAll('.item')){
      const a = v[+row.dataset.i]; if (!a) continue;
      const left = a.period - (Date.now()/1000) % a.period;
      const soon = left < 5;
      const code = await totp(a.secret, a.period, a.digits);
      const el = row.querySelector('[data-code]');
      el.textContent = mask && !row.querySelector('.face').matches(':hover')
        ? '•'.repeat(a.digits)
        : code.replace(/(.{3})(?=.)/g,'$1 ');
      el.classList.toggle('soon', soon);
      const ring = row.querySelector('[data-ring]');
      ring.style.setProperty('--p', (left / a.period).toFixed(3));
      ring.classList.toggle('soon', soon);
    }
  }
}
setInterval(tick, 250); // ponytail: redraw everything each 250ms. ~6 rows; optimize at 600.

// ---------- interactions ----------
$('#q').oninput = e => { filter = e.target.value.toLowerCase().trim(); sel = 0; render(); };

// ---- swipe left to reveal edit / remove ----
const REVEAL = 88;                       // two 44px buttons
let openRow = null, sw = null, swiping = false;
function closeRow(){ if (openRow){ openRow.classList.remove('open'); openRow = null; } }
function openRowAt(row){ if (openRow !== row) closeRow(); row.classList.add('open'); openRow = row; }

$('#list').addEventListener('pointerdown', e => {
  if (e.target.closest('[data-act]')) return;
  const row = e.target.closest('.item'); if (!row) return;
  sw = {row, x:e.clientX, y:e.clientY, base: row.classList.contains('open') ? -REVEAL : 0, moved:false};
});
$('#list').addEventListener('pointermove', e => {
  if (!sw) return;
  const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
  if (!sw.moved){
    if (Math.abs(dx) < 6 || Math.abs(dx) <= Math.abs(dy)) return;
    sw.moved = swiping = true;
    sw.row.classList.add('swiping');
  }
  // ponytail: rubber band past the stops instead of a hard clamp
  let x = sw.base + dx;
  if (x > 0) x *= .25;
  if (x < -REVEAL) x = -REVEAL + (x + REVEAL) * .25;
  sw.row.querySelector('.face').style.transform = 'translateX(' + x + 'px)';
});
addEventListener('pointerup', () => {
  if (!sw) return;
  const {row} = sw;
  if (sw.moved){
    const x = new DOMMatrix(getComputedStyle(row.querySelector('.face')).transform).m41;
    row.classList.remove('swiping');
    row.querySelector('.face').style.transform = '';
    x < -REVEAL / 2 ? openRowAt(row) : closeRow();
    setTimeout(() => swiping = false, 0);   // let the click that follows be swallowed
  }
  sw = null;
});
// trackpad: two fingers sideways on a row
$('#list').addEventListener('wheel', e => {
  const row = e.target.closest('.item'); if (!row) return;
  if (Math.abs(e.deltaX) < 8 || Math.abs(e.deltaX) < Math.abs(e.deltaY)) return;
  e.preventDefault();
  e.deltaX > 0 ? openRowAt(row) : closeRow();
}, {passive:false});

$('#list').onclick = e => {
  const row = e.target.closest('.item'); if (!row) return;
  const a = vis()[+row.dataset.i];
  const act = (e.target.closest('[data-act]') || {}).dataset?.act;
  if (act === 'del'){ closeRow(); accounts = accounts.filter(x => x !== a); render(); toast(a.issuer + ' removed'); return; }
  if (act === 'edit'){ closeRow(); addForm(a); return; }
  if (swiping) return;                  // a swipe is not a click
  if (row === openRow){ closeRow(); return; }
  copy(a);                              // the whole row copies
};
$('#plist').onclick = e => { const r = e.target.closest('.item'); if (r) copy(vis()[+r.dataset.i]); };

let dragged = null;
$('#list').addEventListener('dragstart', e => {
  if (swiping || openRow){ e.preventDefault(); return; }
  dragged = e.target.closest('.item'); dragged.classList.add('drag');
});
$('#list').addEventListener('dragover', e => {
  e.preventDefault();
  const r = e.target.closest('.item'); if (!r || r === dragged) return;
  $('#list').querySelectorAll('.over').forEach(x => x.classList.remove('over'));
  r.classList.add('over');
});
$('#list').addEventListener('drop', e => {
  e.preventDefault();
  const r = e.target.closest('.item'); if (!r || !dragged) return;
  const [from, to] = [+dragged.dataset.i, +r.dataset.i];
  accounts.splice(to, 0, ...accounts.splice(from, 1));
  render();
});
$('#list').addEventListener('dragend', () => { dragged = null; render(); });

// overlay panels
function show(id){
  if (id !== 'p-add') editing = null;
  document.querySelectorAll('.panelview').forEach(p => p.classList.toggle('on', p.id === id));
  $('#b-add').classList.toggle('on', id === 'p-add');
  $('#b-set').classList.toggle('on', id === 'p-set');
}
$('#b-add').onclick = () => $('#p-add').classList.contains('on') ? show('') : addForm(null);
$('#b-set').onclick = () => show($('#p-set').classList.contains('on') ? '' : 'p-set');
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => show(''));

$('#seg').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  $('#seg').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('[data-mode]').forEach(d => d.style.display = d.dataset.mode === b.dataset.m ? 'grid' : 'none');
};

$('#sw-mask').onchange = e => { mask = e.target.checked; tick(); };
const clip = $('#clip');
const paintClip = () => {
  clip.style.setProperty('--f', (clip.value / clip.max * 100) + '%');
  $('#clip-note').textContent = clip.value === '0' ? 'never' : 'after ' + clip.value + ' s';
};
clip.oninput = paintClip; paintClip();

// ---- edit: the add form, prefilled ----
let editing = null;
const toURI = a => 'otpauth://totp/' + encodeURIComponent(a.issuer + (a.label ? ':' + a.label : ''))
  + '?secret=' + a.secret + '&issuer=' + encodeURIComponent(a.issuer)
  + (a.digits !== 6 ? '&digits=' + a.digits : '') + (a.period !== 30 ? '&period=' + a.period : '');

function addForm(account){
  editing = account || null;
  $('#add-title').textContent = account ? 'Edit account' : 'Add account';
  $('#uri-add').textContent   = account ? 'Save' : 'Add';
  $('#uri-clear').textContent = account ? 'Cancel' : 'Clear';
  $('#seg').style.display     = account ? 'none' : '';
  $('#uri-in').value          = account ? toURI(account) : '';
  $('#uri-msg').style.display = 'none';
  if (account) $('#seg').querySelector('button').click();
  show('p-add');
}
$('#uri-clear').onclick = () => {
  if (editing) return show('');
  $('#uri-in').value = ''; $('#uri-msg').style.display = 'none';
};
$('#uri-add').onclick = () => {
  const msg = $('#uri-msg'); msg.style.display = 'none';
  try {
    const a = parseURI($('#uri-in').value);
    b32decode(a.secret);
    if (editing){ Object.assign(editing, a); toast(a.issuer + ' saved'); }   // keeps its place in the list
    else { accounts.push(a); toast(a.issuer + ' added'); }
    $('#uri-in').value = '';
    render(); show('');
  } catch (ex){ msg.textContent = ex.message; msg.style.display = 'block'; }
};
$('#bulk-add').onclick = () => toast('Nothing to import yet');

const drop = $('#drop');
['dragover','dragenter'].forEach(n => drop.addEventListener(n, e => { e.preventDefault(); drop.classList.add('hot'); }));
['dragleave','drop'].forEach(n => drop.addEventListener(n, e => { e.preventDefault(); drop.classList.remove('hot'); }));
drop.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) toast('Reading ' + f.name); });

const RESERVED = ['Meta+Space','Meta+Tab','Meta+KeyQ','Meta+Shift+Digit3','Meta+Shift+Digit4'];
const PRETTY = {Meta:'⌘', Shift:'⇧', Alt:'⌥', Control:'⌃'};
$('#rec').onclick = () => {
  const el = $('#rec'), note = $('#rec-note');
  el.classList.add('rec'); el.textContent = 'press keys'; note.textContent = 'Listening…';
  const done = e => {
    e.preventDefault();
    if (['Meta','Shift','Alt','Control'].includes(e.key)) return;
    const mods = ['Control','Alt','Shift','Meta'].filter(m => e.getModifierState(m));
    const combo = [...mods, e.code].join('+');
    el.classList.remove('rec');
    note.textContent = !mods.length ? 'Hold ⌘ or ⌥ as well.'
      : RESERVED.includes(combo) ? 'That one is already taken.'
      : 'Summon the list anywhere';
    el.textContent = [...mods.map(m => PRETTY[m]), e.code.replace(/^(Key|Digit)/,'')].join(' ');
    window.removeEventListener('keydown', done, true);
  };
  window.addEventListener('keydown', done, true);
};

window.addEventListener('keydown', e => {
  if ($('#rec').classList.contains('rec')) return;
  const typing = /INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
  if (e.key === '/' && !typing){ e.preventDefault(); show(''); $('#q').focus(); }
  if (e.key === 'Escape'){ closeRow(); show(''); $('#q').value = ''; filter = ''; render(); e.target.blur?.(); }
  if (typing) return;
  const v = vis();
  if (e.key === 'ArrowDown'){ sel = Math.min(sel+1, Math.min(v.length,5)-1); render(); }
  if (e.key === 'ArrowUp'){ sel = Math.max(sel-1, 0); render(); }
  if (e.key === 'Enter' && v[sel]) copy(v[sel]);
  if (/^[1-9]$/.test(e.key) && v[+e.key-1]) copy(v[+e.key-1]);
});

render();

// ---------- self-check ----------
(async () => {
  const t0 = new Date('2024-01-01T00:00:00Z').getTime();
  const real = Date.now; Date.now = () => t0;
  console.assert(await totp('GEZDGNBVGY3TQOJQKRSXG5BAMZXXE===') === '019684', 'totp vector');
  Date.now = real;
  console.assert(b32decode('JBSWY3DP').length === 5, 'base32 length');
  console.assert(parseURI('otpauth://totp/GitHub:me?secret=JBSWY3DPEHPK3PXP&issuer=GitHub').label === 'me', 'uri label');
  try { b32decode('1!'); console.assert(false, 'should reject bad key'); } catch {}
  console.log('%cself-check done', 'color:#8e8e93');
})();
</script>
